services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agritwin
      POSTGRES_PASSWORD: agritwin_local
      POSTGRES_DB: agritwin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agritwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritwin"]
      interval: 5s
      retries: 10
volumes:
  agritwin_pg:
