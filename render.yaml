services:
  - type: web
    name: agritwin-digital-twin
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build && npm run db:deploy
    startCommand: npm run start -w @agritwin/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
